# Production deployment on the VPS (187.127.131.34), synced to
# /home/deploy/conferra/docker-compose.yml by .github/workflows/deploy.yml.
#
# Talks to the *existing* LiveKit + Redis + Egress stack already running on
# this box (/root/livekit/docker-compose.yml) via host.docker.internal —
# it is not redefined here. See README.md's "LiveKit backend" section for
# that stack's shape.
#
# .env and ai-notes.env live only on the VPS (never committed) — see the
# deploy runbook for their contents.

services:
  app:
    image: ghcr.io/jainbhavesh/confera-app:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./recordings:/app/recordings"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confera
      POSTGRES_DB: confera
      # Substituted from the .env file in this directory (docker compose
      # auto-loads it for variable interpolation) — must match the password
      # embedded in DATABASE_URL inside .env itself, since env_file values
      # aren't cross-substituted.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes: ["./postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confera"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-notes:
    image: ghcr.io/jainbhavesh/confera-ai-notes:latest
    restart: unless-stopped
    env_file: [ai-notes.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8100:8100"]
    volumes: ["./ai-notes-models:/models"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: conferra-cloudflared
    restart: unless-stopped
    network_mode: host
    volumes: ["./cloudflared-ingress.yml:/etc/cloudflared/config.yml:ro"]
    # ${TUNNEL_TOKEN} is substituted by docker compose from .env in this
    # directory at parse time — not injected as a container env var. The
    # --config file supplies ingress rules locally rather than relying on
    # Cloudflare's remote "Public Hostname" dashboard config, which proved
    # unreliable to configure via API/dashboard for this account.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${TUNNEL_TOKEN}
