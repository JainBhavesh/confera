name: Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/jainbhavesh/confera-app
  AI_NOTES_IMAGE: ghcr.io/jainbhavesh/confera-ai-notes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The committed package-lock.json was generated with npm 11 — the
      # npm 10.x bundled with actions/setup-node's Node 20 resolves it
      # differently and npm ci rejects it as "out of sync".
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ai-notes-changed: ${{ steps.filter.outputs.ai-notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-notes:
              - 'ai-notes/**'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.filter.outputs.ai-notes == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./ai-notes
          push: true
          tags: |
            ${{ env.AI_NOTES_IMAGE }}:latest
            ${{ env.AI_NOTES_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=ai-notes
          cache-to: type=gha,mode=max,scope=ai-notes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Set up deploy key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
      - name: Sync compose + tunnel ingress config
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/conferra/docker-compose.yml"
          scp -i ~/.ssh/deploy_key cloudflared-ingress.yml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/conferra/cloudflared-ingress.yml"
      - name: Pull, deploy, migrate
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "
            set -e
            cd ~/conferra
            APP_TAG=${{ github.sha }} docker compose pull
            APP_TAG=${{ github.sha }} docker compose up -d
            docker compose exec -T app npx prisma migrate deploy
            for i in \$(seq 1 15); do
              curl -sf http://127.0.0.1:3000/api/health && exit 0
              sleep 2
            done
            echo 'health check failed'; exit 1
          "
